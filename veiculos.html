<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Painel Frota - Veículos
    </title>


    <!-- ================= CSS ================= -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/veiculos.css">

    <link rel="stylesheet" href="css/components.css">


</head>


<body>


<!-- ======================================================================
     HEADER
====================================================================== -->


<header class="header">


    <div class="header-logo">


        <img

            src="assets/img/logo.png"

            alt="Logo Frota"

        >


    </div>



    <div class="header-title">


        <h1>

            VEÍCULOS

        </h1>


    </div>




    <div class="header-info">


        <div

            id="clock"

            class="clock"

        >

        </div>




        <button

            id="btnFullscreen"

            class="btn-icon"

        >

            ⛶

        </button>


    </div>



</header>





<!-- ======================================================================
     CONTEÚDO
====================================================================== -->


<main class="page-container">





<!-- ======================================================================
     FORMULÁRIO
====================================================================== -->


<section class="card">


    <h2>

        CADASTRO DE VEÍCULO

    </h2>




    <form

        id="formVeiculo"

        class="form-grid"

    >

        <div class="form-group">


<label>
Data
</label>


<input

type="date"

id="data"

name="data"

required

>
      <div class="form-group">

<label>
Veículo
</label>

<input

type="text"

id="veiculo"

name="veiculo"

>

</div>

     
        <!-- STATUS -->


        <div class="form-group">


            <label>

                Status

            </label>


            <select

                name="status"

            >


                <option>

                    LIVRE

                </option>


                <option>

                    OCUPADO

                </option>


                <option>

                    MANUTENÇÃO

                </option>


                <option>

                    INATIVO

                </option>


            </select>


        </div>






        <!-- BOTÕES -->


        <div class="form-actions">


            <button

                type="submit"

                id="btnSalvar"

                class="btn-primary"

            >

                SALVAR

            </button>

<button

type="button"

id="btnNovo"

class="btn-secondary">

NOVO

</button>


            <button

                type="reset"

                class="btn-secondary"

            >

                LIMPAR

            </button>



        </div>



    </form>


</section>







<!-- ======================================================================
     LISTAGEM
====================================================================== -->


<section class="card">


    <h2>

        VEÍCULOS CADASTRADOS

    </h2>





    <div class="table-container">


      <div

        id="tabelaVeiculos">

    </div>


    </div>


</section>





</main>






<!-- ======================================================================
     LOADING
====================================================================== -->


<div

    id="loading"

    class="loading-overlay"

>

</div>






<!-- ======================================================================
     JAVASCRIPT
====================================================================== -->


<script

    type="module"

    src="js/pages/veiculos.js"

></script>





</body>

</html>
